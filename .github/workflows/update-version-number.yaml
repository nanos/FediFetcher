name: Update Version number and build docker images

"on":
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
  
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: 'Update Version number'
        run: |
          git clone https://${{ secrets.WIKI_ACTION_TOKEN }}@github.com/nanos/FediFetcher.git
          cd FediFetcher
          git config user.name nanos-bot
          git config user.email bot@thms.uk
          VERSION=${{ github.ref_name }}
          VERSION="${VERSION:1}"
          if ! grep "VERSION = \"$VERSION\"" "fedifetcher/__init__.py"; then
            sed -i -E 's/^VERSION = ".*"$/VERSION = "'"$VERSION"'"/' fedifetcher/__init__.py
            if ! grep -q "VERSION = \"$VERSION\"" fedifetcher/__init__.py; then
              echo "::error::Could not set version to $VERSION in fedifetcher/__init__.py"
              exit 1
            fi
            git add fedifetcher/__init__.py
            git commit -m "[bot] Bump version to $VERSION"
            git push origin HEAD:main > /dev/null 2>&1
            git tag -f "v$VERSION"
            git push -f origin "v$VERSION" > /dev/null 2>&1
          fi
  
  docker:
    needs: run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # `run` may have just bumped the version and moved the tag, so take the
          # ref as it stands now rather than as it was when this workflow started
          ref: ${{ github.ref_name }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Work out the image tags, version and revision
        id: tags
        env:
          REF: ${{ github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/fedifetcher
        run: |
          echo "version=${REF#v}" >> "$GITHUB_OUTPUT"
          # not github.sha: `run` may have moved the tag onto its version bump commit
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "$IMAGE:$REF"
            echo "$IMAGE:latest"
            # Only an unsuffixed vX.Y.Z tag is a stable release; v8.1.0-rc1 is not.
            # Pre-releases must not move the major and minor tags: someone pinned
            # to v8 is asking for 8.x patches, not for a release candidate.
            if [[ "$REF" =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
              echo "$IMAGE:stable"
              echo "$IMAGE:v${BASH_REMATCH[1]}"
              echo "$IMAGE:v${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
            REVISION=${{ steps.tags.outputs.revision }}
